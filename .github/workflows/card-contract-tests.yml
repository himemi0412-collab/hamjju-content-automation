name: Card contract tests

on:
  push:
    branches:
      - codex/fix-blog-subject-qa-20260924

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install system media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run full test suite
        run: pytest -q
