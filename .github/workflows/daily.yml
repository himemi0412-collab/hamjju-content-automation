name: Hamjju Daily Content Production

env:
  IMAGE_QUALITY: medium
  OPENAI_MONTHLY_BUDGET_USD: '22'
  OPENAI_BUDGET_LEDGER: output/openai-cost-ledger.json
  OPENAI_BUDGET_REQUIRE_EXISTING_LEDGER: 'true'
  # The project dashboard showed $0.64 spent when this guard was introduced.
  # This one-time baseline is ignored automatically after September 2026.
  OPENAI_BUDGET_BASELINE_MONTH: '2026-09'
  OPENAI_BUDGET_BASELINE_USD: '0.64'

on:
  schedule:
    # GitHub cron is UTC: 01:00=10:00 KST, 12:00=21:00 KST
    - cron: '0 1 * * *'
    - cron: '0 12 * * *'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to inspect or process
        required: true
        type: choice
        default: naver_blog
        options:
          - naver_blog
          - ppojjugi_shorts
          - japan_shorts
      mode:
        description: Dry run, text only, reviewed MP4, today's Shorts, or OAuth verification
        required: true
        type: choice
        default: dry_run
        options:
          - dry_run
          - execute_text
          - execute_media
          - produce_daily_shorts
          - retry_revision
          - regenerate_review
          - repair_video
          - verify_youtube_auth
      source_run_id:
        description: Previous Actions run ID used only for repair_video
        required: false
        type: string
      page_id:
        description: Notion page ID used only for repair_video
        required: false
        type: string

concurrency:
  group: hamjju-content-automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Restore the cross-run OpenAI budget ledger
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'dry_run' && inputs.mode != 'repair_video' && inputs.mode != 'verify_youtube_auth') }}
        uses: actions/cache@v6
        with:
          path: output/openai-cost-ledger.json
          key: hamjju-openai-budget-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            hamjju-openai-budget-${{ runner.os }}-
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install ffmpeg and Korean/Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run safety tests
        run: pytest -q
      - name: Materialize YouTube OAuth files
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 12 * * *') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'execute_media' || inputs.mode == 'produce_daily_shorts' || inputs.mode == 'retry_revision' || inputs.mode == 'verify_youtube_auth')) }}
        env:
          YOUTUBE_CLIENT_SECRET_JSON_B64: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON_B64 }}
          YOUTUBE_PPOJJUGI_TOKEN_JSON_B64: ${{ secrets.YOUTUBE_PPOJJUGI_TOKEN_JSON_B64 }}
          YOUTUBE_JAPAN_TOKEN_JSON_B64: ${{ secrets.YOUTUBE_JAPAN_TOKEN_JSON_B64 }}
        run: |
          test -n "$YOUTUBE_CLIENT_SECRET_JSON_B64"
          test -n "$YOUTUBE_PPOJJUGI_TOKEN_JSON_B64"
          test -n "$YOUTUBE_JAPAN_TOKEN_JSON_B64"
          install -d -m 700 secrets
          umask 077
          printf '%s' "$YOUTUBE_CLIENT_SECRET_JSON_B64" | base64 --decode > secrets/youtube_client_secret.json
          printf '%s' "$YOUTUBE_PPOJJUGI_TOKEN_JSON_B64" | base64 --decode > secrets/youtube_ppojjugi_token.json
          printf '%s' "$YOUTUBE_JAPAN_TOKEN_JSON_B64" | base64 --decode > secrets/youtube_japan_token.json
      - name: Check configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
        run: python -m app.main doctor
      - name: Read one Notion item without modifying it
        if: ${{ inputs.mode == 'dry_run' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          ENABLE_WEB_RESEARCH: 'true'
          ENABLE_MEDIA_GENERATION: 'false'
          AUTO_PRIVATE_YOUTUBE_UPLOAD: 'false'
        run: python -m app.main channel "${{ inputs.channel }}" --dry-run --limit 1 --require-item
      - name: Process one text item after review
        if: ${{ inputs.mode == 'execute_text' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          ENABLE_WEB_RESEARCH: 'true'
          ENABLE_MEDIA_GENERATION: 'false'
          AUTO_PRIVATE_YOUTUBE_UPLOAD: 'false'
        run: python -m app.main channel "${{ inputs.channel }}" --limit 1 --require-item
      - name: Generate one reviewed Shorts MP4
        if: ${{ inputs.mode == 'execute_media' && inputs.channel != 'naver_blog' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          ENABLE_WEB_RESEARCH: 'true'
          ENABLE_MEDIA_GENERATION: 'true'
          AUTO_PRIVATE_YOUTUBE_UPLOAD: 'true'
        run: python -m app.main channel "${{ inputs.channel }}" --limit 1 --require-item

      - name: Produce today's two reviewed Shorts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'produce_daily_shorts' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          ENABLE_WEB_RESEARCH: 'true'
          ENABLE_MEDIA_GENERATION: 'true'
          AUTO_PRIVATE_YOUTUBE_UPLOAD: 'true'
        run: |
          python -m app.main seed-topics --blog-count 0 --ppojjugi-count 1 --japan-count 1
          python -m app.main channel ppojjugi_shorts --limit 1
          python -m app.main channel japan_shorts --limit 1

      - name: Retry one QA revision with reviewed media generation
        if: ${{ inputs.mode == 'retry_revision' && inputs.channel != 'naver_blog' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          ENABLE_WEB_RESEARCH: 'true'
          ENABLE_MEDIA_GENERATION: 'true'
          AUTO_PRIVATE_YOUTUBE_UPLOAD: 'true'
        run: python -m app.main channel "${{ inputs.channel }}" --limit 1 --require-item --retry-revision

      - name: Regenerate one exact Shorts review without YouTube upload
        if: ${{ inputs.mode == 'regenerate_review' && inputs.channel != 'naver_blog' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          ENABLE_WEB_RESEARCH: 'true'
          ENABLE_MEDIA_GENERATION: 'true'
          AUTO_PRIVATE_YOUTUBE_UPLOAD: 'false'
        run: |
          test -n "${{ inputs.page_id }}"
          python -m app.main page "${{ inputs.channel }}" "${{ inputs.page_id }}" --retry-revision

      - name: Verify both YouTube OAuth channel identities without uploading
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'verify_youtube_auth' }}
        run: python -m app.main verify-youtube-auth

      - name: Repair and reattach one existing review video
        if: ${{ inputs.mode == 'repair_video' && inputs.channel != 'naver_blog' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          AUTO_PRIVATE_YOUTUBE_UPLOAD: 'false'
        run: |
          test -n "${{ inputs.source_run_id }}"
          test -n "${{ inputs.page_id }}"
          run_id="${{ inputs.source_run_id }}"
          page_id="${{ inputs.page_id }}"
          page_folder="$(printf '%s' "$page_id" | tr -d '-' | cut -c1-16)"
          gh run download "$run_id" --name "hamjju-output-$run_id" --dir recovered
          python -m app.main repair-short-video "${{ inputs.channel }}" "$page_id" "recovered/$page_folder"

      - name: Run scheduled production
        if: ${{ github.event_name == 'schedule' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          ENABLE_WEB_RESEARCH: 'true'
          AUTO_PRIVATE_YOUTUBE_UPLOAD: 'false'
        run: |
          if [ "${{ github.event.schedule }}" = "0 1 * * *" ]; then
            python -m app.main seed-topics --blog-count 3 --ppojjugi-count 0 --japan-count 0
            ENABLE_MEDIA_GENERATION=false python -m app.main channel naver_blog --limit 3
          else
            python -m app.main seed-topics --blog-count 0 --ppojjugi-count 1 --japan-count 1
            ENABLE_MEDIA_GENERATION=true AUTO_PRIVATE_YOUTUBE_UPLOAD=true python -m app.main channel ppojjugi_shorts --limit 1
            ENABLE_MEDIA_GENERATION=true AUTO_PRIVATE_YOUTUBE_UPLOAD=true python -m app.main channel japan_shorts --limit 1
          fi

      - name: Keep generated files for inspection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hamjju-output-${{ github.run_id }}
          path: output/
          retention-days: 14

      - name: Update mobile status board
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_STATUS: ${{ job.status }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_CHANNEL: ${{ inputs.channel }}
        run: |
          if [ "$RUN_STATUS" = "success" ]; then
            state="✅ 정상 완료"
          else
            state="❌ 확인 필요"
          fi

          if [ "$EVENT_NAME" = "schedule" ] && [ "$SCHEDULE_EXPR" = "0 1 * * *" ]; then
            task="10:00 KST 블로그 자동 제작"
          elif [ "$EVENT_NAME" = "schedule" ] && [ "$SCHEDULE_EXPR" = "0 12 * * *" ]; then
            task="21:00 KST 쇼츠 자동 제작"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            task="수동 실행: ${DISPATCH_CHANNEL:-미지정} / ${DISPATCH_MODE:-미지정}"
          elif [ "$EVENT_NAME" = "push" ]; then
            task="코드 변경 안전성 검사"
          else
            task="$EVENT_NAME"
          fi

          updated_at="$(date -u '+%Y-%m-%d %H:%M UTC')"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          cat > /tmp/hamjju-status.md <<EOF
          ## 햄쮸 자동화 운영 상태

          - 현재 상태: **$state**
          - 마지막 작업: **$task**
          - 마지막 확인: **$updated_at**
          - 실행 상세: $run_url
          - 자동 실행: **매일 10:00 KST 블로그 / 21:00 KST 쇼츠**

          ### 안전장치
          - 네이버 공개·예약 발행: **안 함**
          - YouTube 업로드: **비공개만**
          - OpenAI 내부 월 한도: **\$22**
          - 실패 시 성공 처리하지 않고 확인 대상으로 남김

          ### 평소 사용법
          정상일 때는 결과만 확인하면 됩니다. 실패가 표시되면 해당 실행 로그를 기준으로 실패한 부분만 최소 수정합니다.

          _상태판 갱신 실패는 콘텐츠 제작 자체를 실패시키지 않습니다._
          EOF

          gh issue edit 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/hamjju-status.md
