name: Hamjju Daily Content Production

# One-shot no-save verifier trigger revision: human-layout-v4

env:
  IMAGE_QUALITY: medium
  OPENAI_MONTHLY_BUDGET_USD: '40'
  OPENAI_BUDGET_LEDGER: output/openai-cost-ledger.json
  OPENAI_BUDGET_REQUIRE_EXISTING_LEDGER: 'true'
  # The project dashboard showed $0.64 spent when this guard was introduced.
  # This one-time baseline is ignored automatically after September 2026.
  OPENAI_BUDGET_BASELINE_MONTH: '2026-09'
  OPENAI_BUDGET_BASELINE_USD: '0.64'
  # Public upload also requires the Notion page's 공개 승인 checkbox.
  # Keep false until both Shorts channels pass end-to-end private review.
  ALLOW_PUBLIC_YOUTUBE_UPLOAD: 'false'

on:
  schedule:
    # GitHub cron is UTC: 00:45=09:45 KST topic radar, 01:00=10:00 KST blog, 12:00=21:00 KST Shorts
    - cron: '45 0 * * *'
    - cron: '0 1 * * *'
    - cron: '0 12 * * *'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to inspect or process
        required: true
        type: choice
        default: naver_blog
        options:
          - naver_blog
          - ppojjugi_shorts
          - japan_shorts
      mode:
        description: Prepare one topic, dry run, text only, reviewed MP4, today's Shorts, or OAuth verification
        required: true
        type: choice
        default: dry_run
        options:
          - plan_month
          - prepare_topic
          - dry_run
          - execute_text
          - recover_blog
          - resume_blog
          - recover_failed_blog_cards
          - execute_media
          - produce_daily_shorts
          - retry_revision
          - regenerate_review
          - rerender_blog_cards
          - repair_video
          - repair_av_sync
          - explore_card_design
          - verify_youtube_auth
          - verify_blog_card_style_live
      source_run_id:
        description: Previous Actions artifact run ID for resume_blog or repair_video
        required: false
        type: string
      reviewed_run_id:
        description: Original reviewed artifact run ID for a repeated resume_blog recovery
        required: false
        type: string
      page_id:
        description: Exact existing Notion page ID for recovery, resume, regeneration, or repair
        required: false
        type: string
      card_title:
        description: Fixed Korean title used across all 20 cover concepts
        required: false
        type: string
        default: Codex에서 ChatGPT 열어서 토큰 아끼는 법
      card_subtitle:
        description: Fixed subtitle used across all 20 cover concepts
        required: false
        type: string
        default: Quick Chat 활용

concurrency:
  group: hamjju-content-automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Restore the cross-run OpenAI budget ledger
        uses: actions/cache/restore@v6
        with:
          path: output/openai-cost-ledger.json
          key: hamjju-openai-budget-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            hamjju-openai-budget-${{ runner.os }}-
      - name: Restore processing checkpoints
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'plan_month' && inputs.mode != 'prepare_topic' && inputs.mode != 'dry_run' && inputs.mode != 'verify_youtube_auth' && inputs.mode != 'explore_card_design' && inputs.mode != 'verify_blog_card_style_live' && inputs.mode != 'verify_blog_card_style_live') }}
        uses: actions/cache/restore@v6
        with:
          path: output/state.db
          key: hamjju-processing-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hamjju-processing-state-${{ runner.os }}-
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install ffmpeg and Korean/Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run safety tests
        env:
          # Tests exercise the report writer with fixtures. Never let those
          # fixture summaries leak into the real GitHub run summary.
          GITHUB_STEP_SUMMARY: ''
        run: pytest -q
      - name: Render 20 independent card-cover concepts for selection
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'explore_card_design' }}
        env:
          CARD_TITLE: ${{ inputs.card_title }}
          CARD_SUBTITLE: ${{ inputs.card_subtitle }}
        run: |
          test -n "$CARD_TITLE"
          test -n "$CARD_SUBTITLE"
          python -m app.main explore-card-design --title "$CARD_TITLE" --subtitle "$CARD_SUBTITLE" --output output/card-design-exploration
      - name: Materialize YouTube OAuth files
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 12 * * *') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'execute_media' || inputs.mode == 'produce_daily_shorts' || inputs.mode == 'retry_revision' || inputs.mode == 'repair_av_sync' || inputs.mode == 'verify_youtube_auth')) }}
        env:
          YOUTUBE_CLIENT_SECRET_JSON_B64: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON_B64 }}
          YOUTUBE_PPOJJUGI_TOKEN_JSON_B64: ${{ secrets.YOUTUBE_PPOJJUGI_TOKEN_JSON_B64 }}
          YOUTUBE_JAPAN_TOKEN_JSON_B64: ${{ secrets.YOUTUBE_JAPAN_TOKEN_JSON_B64 }}
        run: |
          test -n "$YOUTUBE_CLIENT_SECRET_JSON_B64"
          test -n "$YOUTUBE_PPOJJUGI_TOKEN_JSON_B64"
          test -n "$YOUTUBE_JAPAN_TOKEN_JSON_B64"
          install -d -m 700 secrets
          umask 077
          printf '%s' "$YOUTUBE_CLIENT_SECRET_JSON_B64" | base64 --decode > secrets/youtube_client_secret.json
          printf '%s' "$YOUTUBE_PPOJJUGI_TOKEN_JSON_B64" | base64 --decode > secrets/youtube_ppojjugi_token.json
          printf '%s' "$YOUTUBE_JAPAN_TOKEN_JSON_B64" | base64 --decode > secrets/youtube_japan_token.json
      - name: Check configuration
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'explore_card_design' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
        run: python -m app.main doctor
      - name: Preflight production dependencies
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'explore_card_design' && inputs.mode != 'verify_youtube_auth' && inputs.mode != 'verify_blog_card_style_live') }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          PREFLIGHT_MODE: ${{ github.event_name == 'schedule' && 'schedule' || inputs.mode }}
          PREFLIGHT_CHANNEL: ${{ inputs.channel }}
          PREFLIGHT_SCHEDULE: ${{ github.event.schedule }}
          PREFLIGHT_PAGE_ID: ${{ inputs.page_id }}
        run: python -m app.preflight
      - name: Generate and QA five blog cards without saving
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'verify_blog_card_style_live') || (github.event_name == 'push' && github.event.head_commit.message == 'Run no-save live card verification') }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ENABLE_WEB_RESEARCH: 'false'
          ENABLE_MEDIA_GENERATION: 'true'
          AUTO_PRIVATE_YOUTUBE_UPLOAD: 'false'
        run: python -m app.main verify-blog-card-style-live

      - name: Research and save one topic for the selected channel
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'prepare_topic' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          ENABLE_WEB_RESEARCH: 'true'
          ENABLE_MEDIA_GENERATION: 'false'
          AUTO_PRIVATE_YOUTUBE_UPLOAD: 'false'
        run: |
          case "${{ inputs.channel }}" in
            naver_blog)
              python -m app.main seed-topics --blog-count 1 --ppojjugi-count 0 --japan-count 0
              ;;
            ppojjugi_shorts)
              python -m app.main seed-topics --blog-count 0 --ppojjugi-count 1 --japan-count 0
              ;;
            japan_shorts)
              python -m app.main seed-topics --blog-count 0 --ppojjugi-count 0 --japan-count 1
              ;;
            *)
              echo "Unsupported channel: ${{ inputs.channel }}"
              exit 1
              ;;
          esac
      - name: Build the 30-day topic inventory in resumable batches
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'plan_month' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          ENABLE_WEB_RESEARCH: 'true'
          ENABLE_MEDIA_GENERATION: 'false'
          AUTO_PRIVATE_YOUTUBE_UPLOAD: 'false'
        run: python -m app.main plan-month --blog-count 90 --ppojjugi-count 30 --japan-count 30 --batch-size 10
      - name: Read one Notion item without modifying it
        if: ${{ inputs.mode == 'dry_run' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          ENABLE_WEB_RESEARCH: 'true'
          ENABLE_MEDIA_GENERATION: 'false'
          AUTO_PRIVATE_YOUTUBE_UPLOAD: 'false'
        run: python -m app.main channel "${{ inputs.channel }}" --dry-run --limit 1 --require-item
      - name: Process one text item after review
        if: ${{ inputs.mode == 'execute_text' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          ENABLE_WEB_RESEARCH: 'true'
          ENABLE_MEDIA_GENERATION: 'false'
          AUTO_PRIVATE_YOUTUBE_UPLOAD: 'false'
        run: python -m app.main channel "${{ inputs.channel }}" --limit 1 --require-item
      - name: Generate one reviewed Shorts MP4
        if: ${{ inputs.mode == 'execute_media' && inputs.channel != 'naver_blog' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          ENABLE_WEB_RESEARCH: 'true'
          ENABLE_MEDIA_GENERATION: 'true'
          AUTO_PRIVATE_YOUTUBE_UPLOAD: 'true'
          MEDIA_PAGE_ID: ${{ inputs.page_id }}
        run: |
          if [ -n "$MEDIA_PAGE_ID" ]; then
            [[ "$MEDIA_PAGE_ID" =~ ^[0-9a-fA-F-]{32,36}$ ]]
            python -m app.main page "${{ inputs.channel }}" "$MEDIA_PAGE_ID"
          else
            python -m app.main channel "${{ inputs.channel }}" --limit 1 --require-item
          fi

      - name: Recover one existing blog without creating new topics
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'recover_blog' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          ENABLE_WEB_RESEARCH: 'true'
          ENABLE_MEDIA_GENERATION: 'false'
          AUTO_PRIVATE_YOUTUBE_UPLOAD: 'false'
          RECOVERY_PAGE_ID: ${{ inputs.page_id }}
        run: |
          test -n "$RECOVERY_PAGE_ID"
          python -m app.main page naver_blog "$RECOVERY_PAGE_ID"

      - name: Resume one existing blog artifact without regenerating its text
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'resume_blog' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          ENABLE_WEB_RESEARCH: 'true'
          ENABLE_MEDIA_GENERATION: 'false'
          AUTO_PRIVATE_YOUTUBE_UPLOAD: 'false'
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          REVIEWED_RUN_ID: ${{ inputs.reviewed_run_id }}
          RESUME_PAGE_ID: ${{ inputs.page_id }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RESUME_PAGE_ID" =~ ^[0-9a-fA-F-]{32,36}$ ]]
          page_folder="$(printf '%s' "$RESUME_PAGE_ID" | tr -d '-' | cut -c1-16)"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "hamjju-output-$SOURCE_RUN_ID" --dir recovered
          original_run_id="$(python -c 'import os; from pathlib import Path; from app.run_report import original_batch_run_id; print(original_batch_run_id(Path("recovered"), os.environ["SOURCE_RUN_ID"], os.environ["RESUME_PAGE_ID"]))')"
          if [ -n "$REVIEWED_RUN_ID" ]; then
            [[ "$REVIEWED_RUN_ID" =~ ^[0-9]+$ ]]
            [ "$REVIEWED_RUN_ID" != "$SOURCE_RUN_ID" ]
            original_run_id="$REVIEWED_RUN_ID"
          fi
          if [ -n "$original_run_id" ]; then
            gh run download "$original_run_id" --repo "$GITHUB_REPOSITORY" --name "hamjju-output-$original_run_id" --dir recovered-original
            reviewed_args=(--reviewed-manifest "recovered-original/$page_folder/manifest.json")
          else
            reviewed_args=()
          fi
          python -m app.main resume-blog "$RESUME_PAGE_ID" "recovered/$page_folder/manifest.json" "${reviewed_args[@]}"

      - name: Regenerate rejected cards from one exact failed blog artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'recover_failed_blog_cards' && inputs.channel == 'naver_blog' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          ENABLE_WEB_RESEARCH: 'false'
          ENABLE_MEDIA_GENERATION: 'false'
          AUTO_PRIVATE_YOUTUBE_UPLOAD: 'false'
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RECOVERY_PAGE_ID: ${{ inputs.page_id }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RECOVERY_PAGE_ID" =~ ^[0-9a-fA-F-]{32,36}$ ]]
          page_folder="$(printf '%s' "$RECOVERY_PAGE_ID" | tr -d '-' | cut -c1-16)"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "hamjju-output-$SOURCE_RUN_ID" --dir recovered
          python -m app.main recover-failed-blog-cards "$RECOVERY_PAGE_ID" "recovered/$page_folder/manifest.json"

      - name: Produce today's two reviewed Shorts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'produce_daily_shorts' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          ENABLE_WEB_RESEARCH: 'true'
          ENABLE_MEDIA_GENERATION: 'true'
          AUTO_PRIVATE_YOUTUBE_UPLOAD: 'true'
        run: |
          result=0
          python -m app.main channel ppojjugi_shorts --limit 1 || result=1
          python -m app.main channel japan_shorts --limit 1 || result=1
          exit "$result"

      - name: Retry one QA revision with reviewed media generation
        if: ${{ inputs.mode == 'retry_revision' && inputs.channel != 'naver_blog' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          ENABLE_WEB_RESEARCH: 'true'
          ENABLE_MEDIA_GENERATION: 'true'
          AUTO_PRIVATE_YOUTUBE_UPLOAD: 'true'
          REVISION_PAGE_ID: ${{ inputs.page_id }}
        run: |
          if [ -n "$REVISION_PAGE_ID" ]; then
            [[ "$REVISION_PAGE_ID" =~ ^[0-9a-fA-F-]{32,36}$ ]]
            python -m app.main page "${{ inputs.channel }}" "$REVISION_PAGE_ID" --retry-revision
          else
            python -m app.main channel "${{ inputs.channel }}" --limit 1 --require-item --retry-revision
          fi

      - name: Retry one exact blog revision without publishing
        if: ${{ inputs.mode == 'retry_revision' && inputs.channel == 'naver_blog' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          ENABLE_WEB_RESEARCH: 'true'
          ENABLE_MEDIA_GENERATION: 'false'
          AUTO_PRIVATE_YOUTUBE_UPLOAD: 'false'
          REVISION_PAGE_ID: ${{ inputs.page_id }}
        run: |
          [[ "$REVISION_PAGE_ID" =~ ^[0-9a-fA-F-]{32,36}$ ]]
          python -m app.main page naver_blog "$REVISION_PAGE_ID" --retry-revision

      - name: Re-render one existing blog card set without changing article text
        if: ${{ inputs.mode == 'rerender_blog_cards' && inputs.channel == 'naver_blog' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          ENABLE_WEB_RESEARCH: 'false'
          ENABLE_MEDIA_GENERATION: 'false'
          AUTO_PRIVATE_YOUTUBE_UPLOAD: 'false'
          RERENDER_PAGE_ID: ${{ inputs.page_id }}
        run: |
          IFS=',' read -ra PAGE_IDS <<< "$RERENDER_PAGE_ID"
          test "${#PAGE_IDS[@]}" -ge 1
          test "${#PAGE_IDS[@]}" -le 25
          failures=()
          for page_id in "${PAGE_IDS[@]}"; do
            [[ "$page_id" =~ ^[0-9a-fA-F-]{32,36}$ ]]
            if ! python -m app.main rerender-blog-cards "$page_id"; then
              failures+=("$page_id")
            fi
          done
          if [ "${#failures[@]}" -gt 0 ]; then
            echo "Rerender failures: ${failures[*]}"
            exit 1
          fi

      - name: Regenerate one exact Shorts review without YouTube upload
        if: ${{ inputs.mode == 'regenerate_review' && inputs.channel != 'naver_blog' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          ENABLE_WEB_RESEARCH: 'true'
          ENABLE_MEDIA_GENERATION: 'true'
          AUTO_PRIVATE_YOUTUBE_UPLOAD: 'false'
        run: |
          test -n "${{ inputs.page_id }}"
          python -m app.main page "${{ inputs.channel }}" "${{ inputs.page_id }}" --retry-revision

      - name: Verify both YouTube OAuth channel identities without uploading
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'verify_youtube_auth' }}
        run: python -m app.main verify-youtube-auth

      - name: Repair and reattach one existing review video
        if: ${{ inputs.mode == 'repair_video' && inputs.channel != 'naver_blog' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          AUTO_PRIVATE_YOUTUBE_UPLOAD: 'false'
        run: |
          test -n "${{ inputs.source_run_id }}"
          test -n "${{ inputs.page_id }}"
          run_id="${{ inputs.source_run_id }}"
          page_id="${{ inputs.page_id }}"
          page_folder="$(printf '%s' "$page_id" | tr -d '-' | cut -c1-16)"
          gh run download "$run_id" --name "hamjju-output-$run_id" --dir recovered
          python -m app.main repair-short-video "${{ inputs.channel }}" "$page_id" "recovered/$page_folder"

      - name: Preserve images and repair one Shorts voice subtitle sync
        if: ${{ inputs.mode == 'repair_av_sync' && inputs.channel != 'naver_blog' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          AUTO_PRIVATE_YOUTUBE_UPLOAD: 'true'
        run: |
          [[ "${{ inputs.source_run_id }}" =~ ^[0-9]+$ ]]
          [[ "${{ inputs.page_id }}" =~ ^[0-9a-fA-F-]{32,36}$ ]]
          run_id="${{ inputs.source_run_id }}"
          page_id="${{ inputs.page_id }}"
          page_folder="$(printf '%s' "$page_id" | tr -d '-' | cut -c1-16)"
          gh run download "$run_id" --name "hamjju-output-$run_id" --dir recovered
          python -m app.main repair-short-av "${{ inputs.channel }}" "$page_id" "recovered/$page_folder"

      - name: Run scheduled production
        if: ${{ github.event_name == 'schedule' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          ENABLE_WEB_RESEARCH: 'true'
          AUTO_PRIVATE_YOUTUBE_UPLOAD: 'false'
        run: |
          result=0
          schedule_expr="${{ github.event.schedule }}"
          if [ "$schedule_expr" = "45 0 * * *" ]; then
            # Fill only queue gaps. If enough reviewed topics already exist,
            # seed-topics exits before paying for web research or AI analysis.
            ENABLE_MEDIA_GENERATION=false AUTO_PRIVATE_YOUTUBE_UPLOAD=false python -m app.main seed-topics --blog-count 3 --ppojjugi-count 1 --japan-count 1 || result=1
          elif [ "$schedule_expr" = "0 1 * * *" ]; then
            # A rejected blog can cost five fresh images. Preserve its artifact
            # for reviewed resume/rerender instead of automatically paying for
            # another full manuscript and card set.
            ENABLE_MEDIA_GENERATION=false python -m app.main channel naver_blog --limit 3 || result=1
          elif [ "$schedule_expr" = "0 12 * * *" ]; then
            ENABLE_MEDIA_GENERATION=true AUTO_PRIVATE_YOUTUBE_UPLOAD=true python -m app.main channel ppojjugi_shorts --limit 1 --auto-retry || result=1
            ENABLE_MEDIA_GENERATION=true AUTO_PRIVATE_YOUTUBE_UPLOAD=true python -m app.main channel japan_shorts --limit 1 --auto-retry || result=1
          else
            echo "Unsupported schedule expression: $schedule_expr"
            result=1
          fi
          exit "$result"

      - name: Save charged budget even when production fails
        if: ${{ always() && hashFiles('output/openai-cost-ledger.json') != '' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'dry_run' && inputs.mode != 'repair_video' && inputs.mode != 'verify_youtube_auth' && inputs.mode != 'explore_card_design' && inputs.mode != 'verify_blog_card_style_live')) }}
        uses: actions/cache/save@v6
        with:
          path: output/openai-cost-ledger.json
          key: hamjju-openai-budget-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save processing checkpoints even when one item fails
        if: ${{ always() && hashFiles('output/state.db') != '' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'plan_month' && inputs.mode != 'prepare_topic' && inputs.mode != 'dry_run' && inputs.mode != 'verify_youtube_auth' && inputs.mode != 'explore_card_design' && inputs.mode != 'verify_blog_card_style_live' && inputs.mode != 'verify_blog_card_style_live')) }}
        uses: actions/cache/save@v6
        with:
          path: output/state.db
          key: hamjju-processing-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Summarize actual production evidence
        if: ${{ always() && ((github.event_name == 'schedule' && github.event.schedule != '45 0 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode != 'plan_month' && inputs.mode != 'prepare_topic' && inputs.mode != 'dry_run' && inputs.mode != 'verify_youtube_auth' && inputs.mode != 'explore_card_design' && inputs.mode != 'verify_blog_card_style_live' && inputs.mode != 'verify_blog_card_style_live')) }}
        env:
          RUN_STATUS: ${{ job.status }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_CHANNEL: ${{ inputs.channel }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RESUME_PAGE_ID: ${{ inputs.page_id }}
        run: python -m app.run_report

      - name: Keep generated files for inspection
        if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'verify_blog_card_style_live')) }}
        uses: actions/upload-artifact@v7
        with:
          name: hamjju-output-${{ github.run_id }}
          path: output/
          retention-days: 14

      - name: Update production status board
        if: ${{ always() && ((github.event_name == 'schedule' && github.event.schedule != '45 0 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode != 'plan_month' && inputs.mode != 'prepare_topic' && inputs.mode != 'dry_run' && inputs.mode != 'verify_youtube_auth' && inputs.mode != 'explore_card_design' && inputs.mode != 'verify_blog_card_style_live' && inputs.mode != 'verify_blog_card_style_live')) }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f output/production-summary.md
          gh issue edit 1 --repo "$GITHUB_REPOSITORY" --body-file output/production-summary.md
